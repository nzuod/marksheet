<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マークシート自動採点</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2438;
  --ink-soft:#5B6178;
  --paper:#ECEFE7;
  --surface:#F7F8F3;
  --surface-2:#FFFFFF;
  --line:#D7DACD;
  --blue:#3B6EA5; --blue-soft:#DFE9F3;
  --green:#3F8F6B; --green-soft:#DEEEE5;
  --red:#B94D3D; --red-soft:#F3E1DC;
  --accent:#35406B; --accent-contrast:#FFFFFF;
  --warn:#9C6B1F; --warn-soft:#F1E6D2;
  --radius-s:8px; --radius-m:14px;
  --font-display:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
  --font-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDEFE7; --ink-soft:#B7BBC2;
    --paper:#1B1D1F; --surface:#232527; --surface-2:#2B2D30;
    --line:#3A3D3F;
    --blue:#7EA9D6; --blue-soft:#233246;
    --green:#7BC4A0; --green-soft:#1E332A;
    --red:#E08972; --red-soft:#3A2620;
    --accent:#8590C4; --accent-contrast:#15161C;
    --warn:#D9AE5C; --warn-soft:#3A301C;
  }
}
:root[data-theme="dark"]{
  --ink:#EDEFE7; --ink-soft:#B7BBC2;
  --paper:#1B1D1F; --surface:#232527; --surface-2:#2B2D30;
  --line:#3A3D3F;
  --blue:#7EA9D6; --blue-soft:#233246;
  --green:#7BC4A0; --green-soft:#1E332A;
  --red:#E08972; --red-soft:#3A2620;
  --accent:#8590C4; --accent-contrast:#15161C;
  --warn:#D9AE5C; --warn-soft:#3A301C;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; min-height:100%;
  background:var(--paper); color:var(--ink);
  font-family:var(--font-body);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
#app{ max-width:560px; margin:0 auto; padding:18px 18px 90px; }
h1{ font-family:var(--font-display); font-size:1.25rem; font-weight:700; margin:0; }
h2{ font-family:var(--font-display); font-size:1.05rem; font-weight:700; margin:26px 0 10px; }
h3.section-title{ font-family:var(--font-display); font-size:1rem; font-weight:700; margin:22px 0 6px; padding-left:10px; border-left:4px solid var(--accent); }
.section-divider{ height:1px; background:var(--line); margin:20px 0; }
p{ line-height:1.6; }
.sub{ color:var(--ink-soft); margin-top:4px; }
.hint{ color:var(--ink-soft); font-size:0.85rem; line-height:1.6; }
.error{ color:var(--red); font-size:0.9rem; }
.empty{ color:var(--ink-soft); text-align:center; padding:30px 0; }

label{ display:block; margin:14px 0; font-size:0.85rem; color:var(--ink-soft); }
input, select, textarea{
  display:block; width:100%; margin-top:6px; padding:10px 12px;
  font-family:var(--font-body); font-size:1rem; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-s);
}
textarea{ font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace; font-size:0.85rem; resize:vertical; }
input:focus, select:focus, textarea:focus, button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

.btn{ padding:12px 18px; border:none; border-radius:var(--radius-m); font-family:var(--font-body); font-weight:700; font-size:0.95rem; cursor:pointer; }
.btn-primary{ background:var(--accent); color:var(--accent-contrast); }
.btn-secondary{ background:var(--surface-2); color:var(--ink); border:1px solid var(--line); }
.btn-danger{ background:var(--red); color:#fff; }
.btn-block{ display:block; width:100%; margin-top:12px; }
.btn-link{ background:none; border:none; color:var(--accent); font-family:var(--font-body); font-size:0.9rem; cursor:pointer; padding:6px 0; }
.btn-link.danger{ color:var(--red); }

.topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; position:sticky; top:env(safe-area-inset-top,0px); background:var(--paper); padding:10px 0 14px; margin-bottom:6px; border-bottom:1px solid var(--line); z-index:5; }
.user-badge{ font-size:0.8rem; color:var(--ink-soft); }

.tabs{ display:flex; gap:6px; margin:14px 0 18px; border-bottom:1px solid var(--line); }
.tab{ flex:1; padding:10px 4px; background:none; border:none; border-bottom:3px solid transparent; font-family:var(--font-body); font-weight:700; color:var(--ink-soft); cursor:pointer; }
.tab.active{ color:var(--ink); border-bottom-color:var(--accent); }

.exam-list{ display:flex; flex-direction:column; gap:0; }
.exam-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
.exam-item.admin{ cursor:default; align-items:flex-start; flex-direction:column; gap:8px; }
.exam-item-name{ font-weight:700; }
.exam-item-meta{ font-size:0.82rem; color:var(--ink-soft); margin-top:2px; }
.exam-item-actions{ display:flex; gap:14px; }

.pill{ display:inline-block; font-size:0.7rem; padding:2px 8px; border-radius:100px; margin-left:8px; }
.pill-warn{ background:var(--warn-soft); color:var(--warn); }
.pill-draft{ background:var(--line); color:var(--ink-soft); }
.pill-published{ background:var(--green-soft); color:var(--green); }
.pill-hidden{ background:var(--red-soft); color:var(--red); }

.exam-sub{ color:var(--ink-soft); font-size:0.85rem; margin-top:-4px; }
.q-row{ display:flex; align-items:center; gap:14px; padding:10px 2px; border-bottom:1px solid var(--line); }
.q-no{ width:30px; flex-shrink:0; font-variant-numeric:tabular-nums; font-weight:700; color:var(--ink-soft); }
.bubbles{ display:flex; gap:8px; flex-wrap:wrap; }
.bubble{ width:38px; height:38px; border-radius:50%; border:2px solid var(--line); background:var(--surface-2); color:var(--ink); font-weight:700; cursor:pointer; transition:background .12s, border-color .12s, transform .08s; }
.bubble:active{ transform:scale(0.92); }
.bubble.selected{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); }

.answer-footer{ position:sticky; bottom:env(safe-area-inset-bottom,0px); background:var(--paper); padding:14px 0; margin-top:20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }

.score-hero{ text-align:center; padding:26px 0; }
.score-num{ font-family:var(--font-display); font-size:2.6rem; font-weight:700; }
.score-max{ font-size:1.1rem; color:var(--ink-soft); margin-left:4px; }
.score-rate{ color:var(--ink-soft); margin-top:4px; }

.result-table, .stat-table{ display:flex; flex-direction:column; }
.result-row, .stat-row{ display:flex; justify-content:space-between; gap:8px; padding:10px 2px; border-bottom:1px solid var(--line); font-size:0.9rem; }
.stat-label{ font-weight:700; }

.q-result-list{ display:flex; flex-direction:column; }
.q-result-row{ display:flex; align-items:center; gap:12px; padding:8px 2px; border-bottom:1px solid var(--line); font-size:0.88rem; }
.q-result-row .qn{ width:30px; font-weight:700; color:var(--ink-soft); }
.mark{ width:22px; text-align:center; font-weight:700; }
.mark.ok{ color:var(--green); }
.mark.ng{ color:var(--red); }
.mark.unknown{ color:var(--ink-soft); }
.ans{ color:var(--red); font-weight:700; margin-left:auto; }

.past-list{ display:flex; flex-direction:column; }
.past-item{ display:flex; align-items:center; justify-content:space-between; padding:12px 2px; border-bottom:1px solid var(--line); }
.past-main{ cursor:pointer; flex:1; }
.past-name{ font-weight:700; }
.past-meta{ font-size:0.82rem; color:var(--ink-soft); margin-top:2px; }

.login-hero{ text-align:center; padding:50px 0 10px; }

.recover-result{ margin-top:18px; padding:16px; background:var(--surface); border-radius:var(--radius-m); text-align:center; }
.recover-key{ font-family:var(--font-display); font-size:1.2rem; margin-bottom:12px; }
.hue-blue{ color:var(--blue); }
.hue-green{ color:var(--green); }
.hue-red{ color:var(--red); }

.section-editor, .group-editor{ background:var(--surface); border-radius:var(--radius-m); padding:14px; margin-bottom:14px; }
.bulk-paste{ margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); }
.bulk-paste-whole{ background:var(--surface); border-radius:var(--radius-m); padding:14px; margin-bottom:18px; border:1px dashed var(--accent); }
.row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.row input{ margin-top:0; }
.table-scroll{ overflow-x:auto; }
.q-table{ border-collapse:collapse; width:100%; min-width:520px; }
.q-table th, .q-table td{ padding:6px; border-bottom:1px solid var(--line); font-size:0.82rem; text-align:left; }
.q-table input, .q-table select{ margin-top:0; padding:6px 8px; font-size:0.85rem; }

.ai-joke{ text-align:center; padding:60px 0; color:var(--ink-soft); }
.ai-emoji{ font-size:2.4rem; margin-bottom:10px; }
.ai-coming{ font-family:var(--font-display); letter-spacing:1px; margin-top:6px; }

.modal-backdrop{ position:fixed; inset:0; background:rgba(20,20,20,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
.modal{ background:var(--surface-2); border-radius:var(--radius-m); padding:22px; max-width:360px; width:100%; }
.modal .warn{ color:var(--warn); font-size:0.88rem; }
.modal-actions{ display:flex; gap:10px; margin-top:16px; }
.modal-actions .btn{ flex:1; }

.toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:100px; font-size:0.85rem; z-index:60; }

@media (max-width:400px){
  .bubble{ width:34px; height:34px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, deleteDoc, getDocs, onSnapshot,
  query, where, writeBatch
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
import {
  getAuth, onAuthStateChanged, signInAnonymously,
  signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

// ▼▼▼ 自分のFirebaseプロジェクトの設定に書き換えてください ▼▼▼
// Firebaseコンソール → プロジェクトの設定(歯車アイコン) → 全般 → 「マイアプリ」→ SDK の設定と構成 でコピーできます
const firebaseConfig = {
  apiKey: "AIzaSyDaNve7I6loJ6UHy_GD3XYexl8d4_HSNfQ",
  authDomain: "marksheet-app-64b36.firebaseapp.com",
  projectId: "marksheet-app-64b36",
  storageBucket: "marksheet-app-64b36.firebasestorage.app",
  messagingSenderId: "22038088035",
  appId: "1:22038088035:web:bf8b01018fcf4c95cb6b56",
  measurementId: "G-8VKWE3TB38"
};
// ▲▲▲ ここまで ▲▲▲

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);

(function(){
  "use strict";

  var LS = { USER:'msct_user_v1' }; // 「今どのキーでログイン中か」だけを端末に記憶する（データ本体はFirestore）
  // 管理者用の固定メールアドレス。Firebaseコンソールの Authentication でこのメールアドレスの
  // ユーザーを1人作成し、そのときのパスワードが「共有の管理者キー」になる（複数人で共同管理できる）。
  // 元のアプリのように文字列そのものをソースに書かないので、キーはソースを見ても分からない。
  var ADMIN_EMAIL = 'admin@marksheet.local';
  var COLORS = ['あおくて','みどりいろで','あかくて'];
  var ADJECTIVES = ['ちいさい','まぶしい','しずかな','かわいい','するどい','かたい','あぶない','ぶきような','とうめいな','いけてる','えらい','まじめな'];
  var ANIMALS = ['ぞう','きりん','ぱんだ','さい','いたち','ぺんぎん','ごりら','いるか','ふくろう','くらげ','きつつき','はむすたー'];

  // 有効な生徒用ログインキー（色3種 × 形容詞12種 × 動物12種 = 144*3通り）を全列挙しておき、
  // それ以外の文字列ではログインできないようにする。
  var VALID_STUDENT_KEYS = new Set();
  for(var _c=0;_c<COLORS.length;_c++){
    for(var _a=0;_a<ADJECTIVES.length;_a++){
      for(var _n=0;_n<ANIMALS.length;_n++){
        VALID_STUDENT_KEYS.add(COLORS[_c]+ADJECTIVES[_a]+ANIMALS[_n]);
      }
    }
  }

  function loadJSON(key, fallback){
    try{ var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch(e){ return fallback; }
  }
  function saveJSON(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch(e){ return false; }
  }
  function uid(prefix){ return (prefix||'id')+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function formatDate(ts){
    var d = new Date(ts);
    function p(n){ return String(n).padStart(2,'0'); }
    return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }
  // 選択肢は10個目を「10」ではなく「0」として、表示だけでなく内部の値としても保持する
  function choiceValue(n){ return Number(n)%10; }
  // 学年度は2月始まり〜翌年1月終わり（例: 2026年度＝2026年2月〜2027年1月）。1月中は前年の学年度として扱う。
  function gakunendoYear(d){
    d = d || new Date();
    var m = d.getMonth()+1;
    return m===1 ? (d.getFullYear()-1) : d.getFullYear();
  }
  function gakunendoLabel(y){
    return y+'年度（'+y+'年2月～'+(Number(y)+1)+'年1月）';
  }

  function generateKeyFromNumber(numStr){
    var digits = (numStr||'').replace(/[^0-9]/g,'');
    if(digits.length < 3) return null;
    var first2 = parseInt(digits.slice(0,2),10);
    var rest = parseInt(digits.slice(2),10) || 0;
    var colorIdx = first2 % 3;
    var val = rest % 144;
    var adjIdx = Math.floor(val/12);
    var aniIdx = val % 12;
    return {
      text: COLORS[colorIdx]+ADJECTIVES[adjIdx]+ANIMALS[aniIdx],
      colorIdx: colorIdx, color: COLORS[colorIdx], adjective: ADJECTIVES[adjIdx], animal: ANIMALS[aniIdx]
    };
  }

  // ---- data store helpers（Firestoreをローカルにミラーしておき、既存コードからは今までどおり同期関数として使う） ----
  var examsCache = [];
  var subsCache = [];
  var draftsCache = {}; // key: studentKey+'__'+examId -> answers
  var unsubscribers = [];

  function stopAllSubscriptions(){
    unsubscribers.forEach(function(fn){ try{ fn(); }catch(e){} });
    unsubscribers = [];
  }

  // 管理者: 模試は全件、提出結果は全件購読する（統計画面のため）。下書きは生徒のプライバシーに配慮し購読しない。
  function subscribeAdminData(){
    stopAllSubscriptions();
    unsubscribers.push(onSnapshot(collection(db,'exams'), function(snap){
      examsCache = snap.docs.map(function(d){ return d.data(); });
      render();
    }, function(err){ console.error(err); showToast('模試データの取得に失敗しました'); }));
    unsubscribers.push(onSnapshot(collection(db,'submissions'), function(snap){
      subsCache = snap.docs.map(function(d){ return d.data(); });
      render();
    }, function(err){ console.error(err); showToast('提出データの取得に失敗しました'); }));
  }

  // 生徒: 公開中の模試・自分の提出結果・自分の下書きだけを購読する
  function subscribeStudentData(key){
    stopAllSubscriptions();
    unsubscribers.push(onSnapshot(query(collection(db,'exams'), where('status','==','published')), function(snap){
      examsCache = snap.docs.map(function(d){ return d.data(); });
      render();
    }, function(err){ console.error(err); showToast('模試データの取得に失敗しました'); }));
    unsubscribers.push(onSnapshot(query(collection(db,'submissions'), where('studentKey','==',key)), function(snap){
      subsCache = snap.docs.map(function(d){ return d.data(); });
      render();
    }, function(err){ console.error(err); showToast('提出データの取得に失敗しました'); }));
    unsubscribers.push(onSnapshot(query(collection(db,'drafts'), where('studentKey','==',key)), function(snap){
      var next = {};
      snap.docs.forEach(function(d){ var v=d.data(); next[v.studentKey+'__'+v.examId] = v.answers; });
      draftsCache = next;
      render();
    }, function(err){ console.error(err); showToast('途中保存データの取得に失敗しました'); }));
  }

  function getExams(){ return examsCache; }
  function saveExams(list){
    var prevIds = examsCache.map(function(e){ return e.id; });
    var nextIds = list.map(function(e){ return e.id; });
    examsCache = list; // 楽観的にローカルへ反映（少し遅れてonSnapshotが確定値で上書きする）
    list.forEach(function(e){
      setDoc(doc(db,'exams',e.id), e).catch(function(err){ console.error(err); showToast('模試の保存に失敗しました'); });
    });
    prevIds.filter(function(id){ return nextIds.indexOf(id)===-1; }).forEach(function(id){
      deleteDoc(doc(db,'exams',id)).catch(function(err){ console.error(err); });
    });
  }
  function getSubs(){ return subsCache; }
  function saveSubs(list){
    var prevIds = subsCache.map(function(s){ return s.id; });
    var nextIds = list.map(function(s){ return s.id; });
    subsCache = list;
    list.forEach(function(s){
      setDoc(doc(db,'submissions',s.id), s).catch(function(err){ console.error(err); showToast('提出結果の保存に失敗しました'); });
    });
    prevIds.filter(function(id){ return nextIds.indexOf(id)===-1; }).forEach(function(id){
      deleteDoc(doc(db,'submissions',id)).catch(function(err){ console.error(err); });
    });
  }
  function getDrafts(){ return draftsCache; }
  function saveDrafts(obj){
    var prevKeys = Object.keys(draftsCache);
    var nextKeys = Object.keys(obj);
    draftsCache = obj;
    nextKeys.forEach(function(k){
      var idx = k.indexOf('__');
      var studentKey = k.slice(0,idx), examId = k.slice(idx+2);
      setDoc(doc(db,'drafts',k), {studentKey:studentKey, examId:examId, answers:obj[k], updatedAt:Date.now()})
        .catch(function(err){ console.error(err); });
    });
    prevKeys.filter(function(k){ return nextKeys.indexOf(k)===-1; }).forEach(function(k){
      deleteDoc(doc(db,'drafts',k)).catch(function(err){ console.error(err); });
    });
  }
  // 模試削除時、他の生徒の下書きも含めて確実に削除する（管理者は下書きを購読していないため直接クエリで削除する）
  function deleteDraftsForExam(examId){
    return getDocs(query(collection(db,'drafts'), where('examId','==',examId))).then(function(snap){
      if(snap.empty) return;
      var batch = writeBatch(db);
      snap.docs.forEach(function(d){ batch.delete(d.ref); });
      return batch.commit();
    }).catch(function(err){ console.error(err); });
  }

  function allQuestionsOf(exam){
    var qs = [];
    (exam.sections||[]).forEach(function(sec){
      (sec.questions||[]).forEach(function(q){
        var copy = Object.assign({}, q);
        copy.sectionId = sec.id;
        copy.sectionTitle = sec.title;
        qs.push(copy);
      });
    });
    return qs;
  }

  function gradeExam(exam, answers){
    var qs = allQuestionsOf(exam);
    var groupMap = {};
    (exam.groups||[]).forEach(function(g){ groupMap[g.groupId] = g; });

    var completeGroupQIds = {};
    qs.forEach(function(q){
      if(q.type==='complete' && q.groupId){
        completeGroupQIds[q.groupId] = completeGroupQIds[q.groupId] || [];
        completeGroupQIds[q.groupId].push(q.id);
      }
    });

    // 複数回答は groupId でひも付けたものだけ「グループ内で同じ選択肢の使い回しを禁止」して採点する。
    // groupId が空の問題は、これまでどおり1問ずつ完全に独立して採点する（後方互換）。
    var multiBuckets = {};
    var multiBucketOrder = [];
    qs.forEach(function(q){
      if(q.type==='multi'){
        var key = q.groupId ? ('g:'+q.groupId) : ('solo:'+q.id);
        if(!multiBuckets[key]){ multiBuckets[key]=[]; multiBucketOrder.push(key); }
        multiBuckets[key].push(q.id);
      }
    });

    var total=0, max=0;
    var perQuestion = {};

    // 通常問題
    qs.forEach(function(q){
      if(q.type!=='normal') return;
      var pts = Number(q.points)||0;
      max += pts;
      var ans = answers[q.id];
      var correct = (ans==null) ? null : (ans===q.answer);
      var earned = correct===true ? pts : 0;
      total += earned;
      perQuestion[q.id] = {correct:correct, earned:earned, points:pts, sectionId:q.sectionId};
    });

    // 複数回答（グループ内の重複使用は不正解にする）
    multiBucketOrder.forEach(function(key){
      var qids = multiBuckets[key];
      var used = {};
      qids.forEach(function(qid){
        var q = qs.filter(function(x){ return x.id===qid; })[0];
        var pts = Number(q.points)||0;
        max += pts;
        var ans = answers[qid];
        var correct;
        if(ans==null){ correct=null; }
        else if((q.candidates||[]).indexOf(ans)===-1){ correct=false; }
        else if(used[ans]){ correct=false; }
        else { correct=true; used[ans]=true; }
        var earned = correct===true ? pts : 0;
        total += earned;
        perQuestion[qid] = {correct:correct, earned:earned, points:pts, sectionId:q.sectionId};
      });
    });

    // 完全解答
    // mode:'combo'（既定・後方互換）＝ 並び順は問わず、登録した組み合わせのどれかと一致すれば正解
    // mode:'individual' ＝ 各問が自分自身の正解を持ち、グループ内の全問に正解した場合だけ配点を加算（部分点なし）
    Object.keys(completeGroupQIds).forEach(function(gid){
      var group = groupMap[gid];
      var qids = completeGroupQIds[gid];
      var pts = group ? (Number(group.points)||0) : 0;
      max += pts;
      var mode = (group && group.mode==='individual') ? 'individual' : 'combo';
      var matched, anyNull;
      if(mode==='individual'){
        anyNull = qids.some(function(qid){ return answers[qid]==null; });
        matched = !anyNull && qids.every(function(qid){
          var q = qs.filter(function(x){ return x.id===qid; })[0];
          return answers[qid]===q.answer;
        });
      } else {
        var combo = qids.map(function(qid){ return answers[qid]; });
        anyNull = combo.some(function(v){ return v==null; });
        var sortedCombo = anyNull ? null : combo.slice().sort(function(a,b){ return a-b; });
        matched = !!group && !anyNull && (group.combos||[]).some(function(c){
          if(c.length!==combo.length) return false;
          var sortedC = c.slice().sort(function(a,b){ return a-b; });
          return sortedC.every(function(v,i){ return v===sortedCombo[i]; });
        });
      }
      var earned = matched ? pts : 0;
      total += earned;
      qids.forEach(function(qid){
        var q = qs.filter(function(x){ return x.id===qid; })[0];
        perQuestion[qid] = { correct: anyNull? null : matched, earned:0, points:0, groupId:gid, groupPoints:pts, groupEarned:earned, sectionId:q.sectionId };
      });
    });

    var sectionAgg = {};
    (exam.sections||[]).forEach(function(sec){ sectionAgg[sec.id] = {title:sec.title, earned:0, max:0}; });
    var countedGroups = {};
    qs.forEach(function(q){
      var r = perQuestion[q.id];
      if(!r || !sectionAgg[q.sectionId]) return;
      if(r.groupId){
        if(countedGroups[r.groupId]) return;
        countedGroups[r.groupId] = true;
        sectionAgg[q.sectionId].earned += r.groupEarned;
        sectionAgg[q.sectionId].max += r.groupPoints;
      } else {
        sectionAgg[q.sectionId].earned += r.earned;
        sectionAgg[q.sectionId].max += r.points;
      }
    });

    return { total:total, max:max, perQuestion:perQuestion, sectionAgg:sectionAgg };
  }

  function parseWholeBulkRows(text){
    return (text||'').split(/\r?\n/).map(function(line){
      var trimmed = line.replace(/\r$/,'').trim();
      if(!trimmed) return null;
      var parts = trimmed.split(/\t/);
      if(parts.length<4){ parts = trimmed.split(/,/); }
      if(parts.length<4) return null;
      var section = parts[0].trim();
      var no = parts[1].trim();
      var answer = parts[2].trim();
      var pointsRaw = parts[3].trim();
      if(!section) return null;
      if(!/^\d+$/.test(no) || !/^\d+$/.test(answer)) return null;
      var points = (pointsRaw==='' || isNaN(Number(pointsRaw))) ? 1 : Number(pointsRaw);
      return { section:section, no:no, answer:choiceValue(answer), points:points };
    }).filter(function(r){ return r!=null; });
  }

  function parseBulkRows(text){
    return (text||'').split(/\r?\n/).map(function(line){
      var trimmed = line.trim();
      if(!trimmed) return null;
      var parts = trimmed.split(/\t/);
      if(parts.length<2){ parts = trimmed.split(/[,\s]+/); }
      if(parts.length<2) return null;
      var no = parts[0].trim();
      var answer = parts[1].trim();
      var pointsRaw = parts[2]!=null ? parts[2].trim() : '';
      if(!/^\d+$/.test(no) || !/^\d+$/.test(answer)) return null;
      var points = (pointsRaw==='' || isNaN(Number(pointsRaw))) ? 1 : Number(pointsRaw);
      return { no:no, answer:choiceValue(answer), points:points };
    }).filter(function(r){ return r!=null; });
  }

  function setDeep(root, path, value){
    var parts = path.split('.');
    var cur = root;
    for(var i=0;i<parts.length-1;i++){
      var key = /^\d+$/.test(parts[i]) ? Number(parts[i]) : parts[i];
      var nextIsIndex = /^\d+$/.test(parts[i+1]);
      if(cur[key]==null){ cur[key] = nextIsIndex ? [] : {}; }
      cur = cur[key];
    }
    var lastKey = /^\d+$/.test(parts[parts.length-1]) ? Number(parts[parts.length-1]) : parts[parts.length-1];
    cur[lastKey] = value;
  }

  // 不正解だった問題の「正解」を表示する。複数回答は候補一覧、完全解答はグループの正解
  // （組み合わせモードなら登録済みの組み合わせ、個別モードならその問題自身の正解）を返す。
  function correctAnswerLabel(exam, q){
    if(q.type==='multi'){
      var c = q.candidates||[];
      return c.length ? c.join('・') : null;
    }
    if(q.type==='complete' && q.groupId){
      var g = (exam.groups||[]).filter(function(x){ return x.groupId===q.groupId; })[0];
      if(!g) return null;
      if(g.mode==='individual') return q.answer!=null ? String(q.answer) : null;
      if(!g.combos || !g.combos.length) return null;
      return g.combos.map(function(c){ return c.join('・'); }).join(' または ');
    }
    return q.answer!=null ? String(q.answer) : null;
  }

      + '「全問正解でまとめて配点」モードでは、各問題は自分自身の正解を持ち（問題側の「正解」欄に入力）、グループ内の全問に正解した場合だけ、このグループの配点がまとめて加算されます（部分点なし。例: 問21〜24を同じグループIDにして配点4にすれば、4問すべて正解したときだけ4点）。</p>'

  function renderWholeBulkBox(exam){
    return ''
      + '<div class="bulk-paste-whole">'

  function renderSectionEditor(sec, si, groups){
    var rows = (sec.questions||[]).map(function(q, qi){ return renderQuestionRow(si, q, qi, groups); }).join('');
    return ''
      + '<div class="section-editor">'
      + '<div class="row"><input data-field="editingExam.sections.'+si+'.title" value="'+esc(sec.title)+'" placeholder="大問タイトル 例: 第1問">'
      + '<button class="btn-link danger" data-action="removeSection" data-si="'+si+'">削除</button></div>'
      + '<p class="hint">複数回答にグループIDを設定すると、同じグループ内で同じ選択肢を2回正解として使うことはできなくなります（未設定ならこれまでどおり1問ずつ独立して採点します）。</p>'
      + '<div class="table-scroll"><table class="q-table"><thead><tr><th>番号</th><th>選択肢数</th><th>種別</th><th>正解/候補/グループID</th><th>配点</th><th></th></tr></thead>'
      + '<tbody>'+rows+'</tbody></table></div>'
      + '<button class="btn btn-secondary" data-action="addQuestion" data-si="'+si+'">＋ 問題を追加</button>'
      + '<div class="bulk-paste">'
      + '<label>解答をまとめて貼り付け（1行に「番号　解答　配点」。表計算ソフトからのコピペにも対応。反映するとこの大問の問題リスト全体が置き換わります）'
      + '<textarea rows="4" data-field="editingExam.sections.'+si+'.bulkText" placeholder="1\t1\t4\n2\t2\t4\n3\t4\t3">'+esc(sec.bulkText||'')+'</textarea>'

      + '<button class="btn btn-secondary" data-action="applyBulk" data-si="'+si+'">この大問に反映</button>'
      + '</div>'
      + '</div>';

  function renderQuestionRow(si, q, qi, groups){
    var answerCell;
    var prefix = 'editingExam.sections.'+si+'.questions.'+qi;
    if(q.type==='multi'){
      answerCell = '<input type="text" placeholder="候補 例: 1,4" data-field="'+prefix+'.candidatesText" value="'+esc(q.candidatesText||'')+'">'
        + '<input type="text" style="margin-top:4px" placeholder="グループID(任意・重複防止)" data-field="'+prefix+'.groupId" value="'+esc(q.groupId||'')+'">';
    } else if(q.type==='complete'){
      var grp = (groups||[]).filter(function(g){ return g.groupId===q.groupId; })[0];
      var grpMode = grp && grp.mode==='individual' ? 'individual' : 'combo';
      answerCell = '<input type="text" placeholder="グループID" data-field="'+prefix+'.groupId" value="'+esc(q.groupId||'')+'">';
      if(grpMode==='individual'){
        answerCell += '<input type="number" style="margin-top:4px" placeholder="この問題自身の正解" data-field="'+prefix+'.answer" value="'+(q.answer==null?'':q.answer)+'">';
      }
    } else {
      answerCell = '<input type="number" data-field="'+prefix+'.answer" value="'+(q.answer==null?'':q.answer)+'">';
    }
    return ''
      + '<tr>'
      + '<td><input type="text" style="width:3.2em" data-field="'+prefix+'.no" value="'+esc(q.no)+'"></td>'
      + '<td><input type="number" style="width:4.2em" placeholder="既定" data-field="'+prefix+'.choices" value="'+(q.choices==null?'':q.choices)+'"></td>'
      + '<td><select data-field="'+prefix+'.type" data-rerender="true">'
      + '<option value="normal" '+(q.type==='normal'?'selected':'')+'>通常</option>'
      + '<option value="multi" '+(q.type==='multi'?'selected':'')+'>複数回答</option>'
      + '<option value="complete" '+(q.type==='complete'?'selected':'')+'>完全解答</option>'
      + '</select></td>'
      + '<td>'+answerCell+'</td>'
      + '<td><input type="number" style="width:4.2em" data-field="'+prefix+'.points" value="'+q.points+'"></td>'
      + '<td><button class="btn-link danger" data-action="removeQuestion" data-si="'+si+'" data-qi="'+qi+'">×</button></td>'
      + '</tr>';
  }

  function renderGroupEditor(g, gi){
    var mode = g.mode==='individual' ? 'individual' : 'combo';
    var bodyHtml;
    if(mode==='individual'){
      bodyHtml = '<p class="hint">このグループIDを設定した各問題の「正解」欄に、その問題自身の正解番号を入力してください。グループ内の全問に正解した場合だけ、上の配点が加算されます（部分点なし）。</p>';
    } else {
      var combos = (g.combosText||[]).map(function(c, ci){
        return '<div class="row"><input type="text" data-field="editingExam.groups.'+gi+'.combosText.'+ci+'" value="'+esc(c)+'" placeholder="例: 1,4">'
          + '<button class="btn-link danger" data-action="removeCombo" data-gi="'+gi+'" data-ci="'+ci+'">×</button></div>';
      }).join('');
      bodyHtml = combos
        + '<button class="btn-link" data-action="addCombo" data-gi="'+gi+'">＋ 正解パターンを追加</button>';
    }
    return ''
      + '<div class="group-editor">'
      + '<div class="row"><input data-field="editingExam.groups.'+gi+'.groupId" value="'+esc(g.groupId)+'" placeholder="グループID">'
      + '<input type="number" style="width:6em" data-field="editingExam.groups.'+gi+'.points" value="'+g.points+'" placeholder="配点">'
      + '<button class="btn-link danger" data-action="removeGroup" data-gi="'+gi+'">削除</button></div>'
      + '<label>採点方法<select data-field="editingExam.groups.'+gi+'.mode" data-rerender="true">'
      + '<option value="combo" '+(mode==='combo'?'selected':'')+'>順不同の組み合わせが一致すれば正解</option>'
      + '<option value="individual" '+(mode==='individual'?'selected':'')+'>各問が個別の正解を持ち、全問正解でまとめて配点</option>'
      + '</select></label>'
      + bodyHtml
      + '</div>';
  }

  // ---- main render ----
  function render(){
    var app = document.getElementById('app');
    var html;
    if(state.screen==='loading'){
      html = '<div class="login-hero"><h1>マークシート自動採点</h1><p class="sub">読み込み中…</p></div>';
    } else if(!state.user){
      html = state.screen==='keyRecover' ? renderKeyRecover() : renderLogin();
    } else if(state.user.type==='student'){
      if(state.screen==='examAnswer') html = renderAnswerScreen();
      else if(state.screen==='examResult') html = renderExamResult();
      else html = renderStudentHome();
    } else {
      if(state.screen==='examEdit') html = renderExamEdit();
      else html = renderAdminHome();
    }
    html += renderModal();
    if(state.toast) html += '<div class="toast">'+esc(state.toast)+'</div>';
    app.innerHTML = html;
  }

  // ---- actions ----
  function doSubmitAnswer(){
    var exam = getExams().filter(function(e){ return e.id===state.currentExamId; })[0];
    var result = gradeExam(exam, state.currentAnswers);
    var sub = {
      id: uid('sub'), examId: exam.id, examName: exam.name, studentKey: state.user.key,
      submittedAt: Date.now(), total: result.total, max: result.max,
      perQuestion: result.perQuestion, sectionAgg: result.sectionAgg,
      answers: Object.assign({}, state.currentAnswers)
    };
    var subs = getSubs(); subs.push(sub); saveSubs(subs);
    var drafts = getDrafts(); delete drafts[state.user.key+'__'+exam.id]; saveDrafts(drafts);
    setState({screen:'examResult', currentSubmission: sub, currentAnswers:null, resultOrigin:'list'});
  }

  function saveExamAction(){
    var src = state.editingExam;
    if(!src.name || !src.name.trim()){ showToast('模試名を入力してください'); return; }
    var finalized = {
      id: src.id,
      name: src.name.trim(),
      subject: (src.subject||'').trim(),
      year: src.year,
      status: src.status||'draft',
      defaultChoices: Number(src.defaultChoices)||4,
      sections: (src.sections||[]).map(function(sec){
        return {
          id: sec.id,
          title: (sec.title||'').trim(),
          questions: (sec.questions||[]).map(function(q){
            var base = {
              id:q.id, no:(q.no==null?'':String(q.no)),
              choices: (q.choices===''||q.choices==null) ? null : Number(q.choices),
              type: q.type||'normal',
              points: Number(q.points)||0
            };
            if(base.type==='multi'){
              base.candidates = (q.candidatesText||'').split(',').map(function(s){ return s.trim(); }).filter(function(s){ return s!==''; }).map(Number).map(choiceValue);
              base.groupId = (q.groupId||'').trim();
            } else {
              base.answer = (q.answer===''||q.answer==null) ? null : choiceValue(q.answer);
              if(base.type==='complete'){ base.groupId = (q.groupId||'').trim(); }
            }
            return base;
          })
        };
      }),
      groups: (src.groups||[]).map(function(g){
        var mode = g.mode==='individual' ? 'individual' : 'combo';
        return {
          groupId: (g.groupId||'').trim(),
          points: Number(g.points)||0,
          mode: mode,
          combos: mode==='combo' ? (g.combosText||[]).map(function(t){
            return t.split(',').map(function(s){ return s.trim(); }).filter(function(s){ return s!==''; }).map(Number).map(choiceValue);
          }).filter(function(arr){ return arr.length>0; }) : []
        };
      }).filter(function(g){ return g.groupId; })
    };
    var exams = getExams();
    var idx = -1;
    for(var i=0;i<exams.length;i++){ if(exams[i].id===finalized.id){ idx=i; break; } }
    if(idx>=0) exams[idx]=finalized; else exams.push(finalized);
    saveExams(exams);
    setState({screen:'adminHome', adminTab:'exams', editingExam:null});
  }

      var key = (state.keyInput||'').trim();
      if(!key){ setState({error:'ログインキーを入力してください'}); return; }
      setState({error:null});
      // まず「共有の管理者キー」として試す（Firebase側で検証。合っていれば管理者としてサインインする）。
      // 一致しなければ、生徒キーの一覧と照合する。
      signInWithEmailAndPassword(auth, ADMIN_EMAIL, key).catch(function(){
        if(!VALID_STUDENT_KEYS.has(key)){
          setState({error:'ログインキーが正しくありません。伝えられたキーをそのまま、正確に入力してください。'});
          return;
        }
        var student = {type:'student', key:key};
        saveJSON(LS.USER, student);
        subscribeStudentData(key);
        setState({user:student, screen:'studentHome', studentTab:'list', error:null, keyInput:''});
      });
      // 管理者キーとして成功した場合はonAuthStateChangedが検知してadminHomeへ遷移する

    backToLogin: function(){ setState({screen:'login', recoverResult:null, error:null}); },

      if(!/^[^\s@]+@[^\s@]+\.ed\.jp$/i.test(email)){
        setState({error:'メールアドレスが正しくありません'});
        return;
      }
      var local = email.slice(0, email.indexOf('@'));
      var res = generateKeyFromNumber(local);
      if(!res){ setState({error:'メールアドレスの数字部分を3桁以上、正しく入力してください'}); return; }
      setState({recoverResult:res, error:null});

      render();
    },
    saveDraft: function(){

    confirmSubmit: function(){

      if(!ex) return;

      openConfirm({ message:'この模試を削除しますか？関連する提出結果・途中保存もすべて削除されます。', danger:true, confirmLabel:'削除する', onConfirm:function(){
        saveExams(getExams().filter(function(e){ return e.id!==eid; }));
        saveSubs(getSubs().filter(function(s){ return s.examId!==eid; }));

    addSection: function(){ state.editingExam.sections.push({id:uid('sec'), title:'', questions:[], bulkText:''}); render(); },

    addQuestion: function(el){
      var si = Number(el.dataset.si);
      var sec = state.editingExam.sections[si];
      sec.questions.push({ id:uid('q'), no:String(sec.questions.length+1), choices:null, type:'normal', points:1, answer:null, candidatesText:'', groupId:'' });
      render();
    },
    removeQuestion: function(el){
      var si = Number(el.dataset.si), qi = Number(el.dataset.qi);
      state.editingExam.sections[si].questions.splice(qi,1);
      render();
    },
    addGroup: function(){
      state.editingExam.groups = state.editingExam.groups || [];
      state.editingExam.groups.push({groupId:'', points:0, mode:'combo', combosText:['']});
      render();
    },
    removeGroup: function(el){ state.editingExam.groups.splice(Number(el.dataset.gi),1); render(); },
    addCombo: function(el){ state.editingExam.groups[Number(el.dataset.gi)].combosText.push(''); render(); },
    removeCombo: function(el){
      var gi = Number(el.dataset.gi), ci = Number(el.dataset.ci);
      state.editingExam.groups[gi].combosText.splice(ci,1);
      render();
    },
    applyWholeBulk: function(){
      var rows = parseWholeBulkRows(state.editingExam.wholeBulkText);
      if(rows.length===0){ showToast('貼り付けたデータから大問・番号・解答を読み取れませんでした'); return; }
      var sectionOrder = [];
      var sectionMap = {};
      rows.forEach(function(r){
        if(!sectionMap[r.section]){
          sectionMap[r.section] = { id:uid('sec'), title:r.section, questions:[], bulkText:'' };
          sectionOrder.push(r.section);
        }
        sectionMap[r.section].questions.push({ id:uid('q'), no:r.no, choices:null, type:'normal', points:r.points, answer:r.answer, candidatesText:'', groupId:'' });
      });
      var newSections = sectionOrder.map(function(name){ return sectionMap[name]; });
      openConfirm({
        message: '「'+sectionOrder.join('」「')+'」の'+newSections.length+'個の大問、計'+rows.length+'問を作成します。現在登録されているすべての大問は置き換えられます。',
        warn:'この操作は取り消せません。',
        confirmLabel:'作成する',
        danger:true,
        onConfirm:function(){
          state.editingExam.sections = newSections;
          render();
        }
      });
    },
    applyBulk: function(el){
      var si = Number(el.dataset.si);
      var sec = state.editingExam.sections[si];
      var rows = parseBulkRows(sec.bulkText);
      if(rows.length===0){ showToast('貼り付けたデータから番号・解答を読み取れませんでした'); return; }
      openConfirm({
        message: rows.length+'件のデータをこの大問に反映します。現在のこの大問の問題リストは置き換えられます。',
        warn: '一問ずつ編集した内容は上書きされます。よろしいですか？',
        confirmLabel:'反映する',
        danger:true,
        onConfirm:function(){
          sec.questions = rows.map(function(r){
            return { id:uid('q'), no:r.no, choices:null, type:'normal', points:r.points, answer:r.answer, candidatesText:'', groupId:'' };
          });
          render();
        }
      });
    },
    saveExam: function(){ saveExamAction(); },
    bulkDeleteYear: function(){
      var yearsAvail = [];
      getExams().forEach(function(e){ if(e.year!=null && yearsAvail.indexOf(e.year)===-1) yearsAvail.push(e.year); });
      var y = state.adminDeleteYear!=null ? Number(state.adminDeleteYear) : yearsAvail[0];
      if(y==null) return;
      openConfirm({ message:gakunendoLabel(y)+'のデータを一括削除しますか？この操作は取り消せません。', danger:true, confirmLabel:'削除する', onConfirm:function(){
        var exams = getExams();
        var removedIds = exams.filter(function(e){ return e.year===y; }).map(function(e){ return e.id; });
        saveExams(exams.filter(function(e){ return e.year!==y; }));
        saveSubs(getSubs().filter(function(s){ return removedIds.indexOf(s.examId)===-1; }));
        removedIds.forEach(function(eid){ deleteDraftsForExam(eid); });
        setState({adminDeleteYear:null});
      }});
    },
    closeModal: function(){ setState({modal:null}); },
    modalConfirm: function(){

      setState({modal:null});
      if(m && m.onConfirm) m.onConfirm();
    }

  appEl.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var fn = handlers[el.dataset.action];
    if(fn) fn(el, e);
  });
  function onFieldChange(e){
    var el = e.target.closest('[data-field]');
    if(!el) return;
    var val = el.value;
    if(el.type==='number'){ val = val===''? '' : Number(val); }
    setDeep(state, el.dataset.field, val);
  }
  appEl.addEventListener('input', onFieldChange);
  appEl.addEventListener('change', function(e){
    onFieldChange(e);
    var el = e.target.closest('[data-field][data-rerender="true"]');
    if(el) render();
  });

  render();

  // ---- 認証ブートストラップ ----
  // Firebaseの認証状態が確定するたびに呼ばれる。管理者はメール/パスワードでの実サインイン、
  // 生徒は匿名サインイン＋端末に記憶したキーで判定する。
  onAuthStateChanged(auth, function(user){
    if(!user){
      stopAllSubscriptions();
      examsCache = []; subsCache = []; draftsCache = {};
      var savedUser = loadJSON(LS.USER, null);
      var expectingRestore = !!(savedUser && savedUser.type==='student' && VALID_STUDENT_KEYS.has(savedUser.key));
      state.user = null;
      if(!expectingRestore && state.screen!=='keyRecover'){
        state.screen = 'login';
      }
      render();
      signInAnonymously(auth).catch(function(err){ console.error(err); showToast('サーバーへの接続に失敗しました'); });
      return;
    }
    if(user.isAnonymous===false){
      // メール/パスワードでの実サインイン＝管理者
      var admin = {type:'admin'};
      saveJSON(LS.USER, admin);
      subscribeAdminData();
      setState({user:admin, screen:'adminHome', adminTab:'exams', error:null});
    } else {
      // 匿名サインイン。端末に記憶済みの生徒キーがあれば自動的に復帰する
      var saved = loadJSON(LS.USER, null);
      if(saved && saved.type==='student' && VALID_STUDENT_KEYS.has(saved.key)){
        subscribeStudentData(saved.key);
        setState({user:saved, screen:'studentHome', studentTab:'list'});
      } else {
        if(state.screen==='loading') state.screen = 'login';
        render();
      }
    }
  });
})();
</script>
</body>
</html>
